name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image with declared dev dependencies
        run: docker build --target test -t calmmm-test .

      - name: Run fast test suite
        run: docker run --rm calmmm-test

  inference-smoke:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --target runtime -t calmmm-runtime .

      - name: Run small MAP inference job
        run: >-
          docker run --rm calmmm-runtime
          --mode map
          --weeks 8
          --holdout-fraction 0
          --adjust-lift-windows
          --maxeval 10
